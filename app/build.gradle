plugins { id 'com.android.application' }
android {
    namespace 'cn.wordflow.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.wordflow.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation files('libs/sherpa-onnx-1.12.15.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// An APK without its bundled model cannot provide the advertised offline voice.
tasks.named('preBuild').configure {
    doFirst {
        if (!file('src/main/assets/kokoro/model.int8.onnx').exists()) {
            throw new GradleException('Run python3 scripts/prepare-kokoro.py before building.')
        }
    }
}
